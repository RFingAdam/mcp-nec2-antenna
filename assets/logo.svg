<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="antennaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Antenna icon -->
  <g transform="translate(20, 20)">
    <!-- Dipole elements -->
    <line x1="0" y1="30" x2="30" y2="30" stroke="url(#antennaGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="30" x2="60" y2="30" stroke="url(#antennaGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Feed point -->
    <circle cx="30" cy="30" r="6" fill="url(#antennaGrad)"/>
    <!-- Radiation waves -->
    <path d="M 30 15 Q 45 5, 50 15" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 30 45 Q 45 55, 50 45" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 30 10 Q 55 -5, 65 10" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M 30 50 Q 55 65, 65 50" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.4"/>
  </g>

  <!-- Text -->
  <text x="100" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1F2937">
    MCP NEC2 Antenna
  </text>
  <text x="100" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6B7280">
    Wire antenna design &amp; simulation
  </text>
</svg>
